name: CI de Kordex

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y validar Kordex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: ${{ runner.temp }}/kordex-data
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y comprobar TypeScript
        run: npm run build
